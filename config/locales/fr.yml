fr:
  date:
    abbr_day_names:
    - dim
    - lun
    - mar
    - mer
    - jeu
    - ven
    - sam
    abbr_month_names:
    -
    - janv.
    - févr.
    - mars
    - avr.
    - mai
    - juin
    - juil.
    - août
    - sept.
    - oct.
    - nov.
    - déc.
    day_names:
    - dimanche
    - lundi
    - mardi
    - mercredi
    - jeudi
    - vendredi
    - samedi
    formats:
      default: "%d/%m/%Y"
      long: "%-d %B %Y"
      short: "%-d %b"
    month_names:
    -
    - janvier
    - février
    - mars
    - avril
    - mai
    - juin
    - juillet
    - août
    - septembre
    - octobre
    - novembre
    - décembre
    order:
    - :day
    - :month
    - :year
  time:
    am: am
    formats:
      default: "%d %B %Y, %Hh%M"
      long: "%-d %B %Y, %Hh%M"
      short: "%-d %b, %Hh%M"
    pm: pm
  errors:
    format: "%{attribute} %{message}"
  helpers:
    select:
      prompt: "Veuillez sélectionner"
    submit:
      create: "Créer un(e) %{model}"
      submit: "Enregistrer %{model}"
      update: "Modifier %{model}"
  support:
    array:
      last_word_connector: " et "
      two_words_connector: " et "
      words_connector: ", "
